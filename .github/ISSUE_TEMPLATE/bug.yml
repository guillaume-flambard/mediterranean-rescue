name: Bug
description: Something does not work as it should
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, what you saw instead.
    validations:
      required: true
  - type: input
    id: where
    attributes:
      label: Where
      description: Page address (public site or team space), browser and device.
      placeholder: https://rescue.memolabs.dev/..., Safari on iPhone
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Click ...
  - type: markdown
    attributes:
      value: Do not paste passwords, invitation links or personal data. Security issues go through [a private report](https://github.com/memolabs-dev/mediterranean-rescue/security/advisories/new).
