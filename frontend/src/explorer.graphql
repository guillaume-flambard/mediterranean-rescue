query Explore($filters: EventFilter, $offset: Int!) {
  dataMode
  events(filters: $filters, limit: 25, offset: $offset) {
    totalCount
    hasNext
    items {
      id title occurredOn kind people
      position { longitude latitude precision }
      vessel { name }
      source { name synthetic }
    }
  }
  mapPoints(filters: $filters) {
    locatedCount truncated
    points { id longitude latitude kind }
  }
}

query EventDetail($id: UUID!) {
  event(id: $id) {
    id title summary occurredOn kind people women minors sourceUrl
    position { longitude latitude precision }
    source { name url licenseNote synthetic }
    vessel { name imo }
    voyage { title startedOn endedOn logbookUrl }
    port { name countryCode }
    evidence { label url }
  }
}
