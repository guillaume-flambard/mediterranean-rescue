[project]
name = "mediterranean-rescue"
version = "0.1.0"
description = "Historical rescue data platform with provenance and controlled publication"
requires-python = ">=3.12,<3.14"
dependencies = [
  "Django>=5.2.18,<5.3",
  "strawberry-graphql-django>=0.93,<0.94",
  "psycopg[binary]>=3.3.6,<3.4",
  "gunicorn>=23,<24",
]

[dependency-groups]
dev = ["ruff>=0.14,<0.15"]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
exclude = ["backend/catalog/migrations"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
