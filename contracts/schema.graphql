input Bounds {
  west: Float!
  south: Float!
  east: Float!
  north: Float!
}

"""Date (isoformat)"""
scalar Date

input EventFilter {
  start: Date = null
  end: Date = null
  kind: Kind = null
  bounds: Bounds = null
}

type EventPage {
  items: [EventType!]!
  totalCount: Int!
  hasNext: Boolean!
}

type EventType {
  source: SourceType!
  vessel: VesselType
  voyage: VoyageType
  port: PortType
  evidence: [EvidenceType!]!
  id: UUID!
  occurredOn: Date!
  title: String!
  summary: String!
  sourceUrl: String!
  people: Int
  women: Int
  minors: Int
  kind: Kind!
  position: Position
}

type EvidenceType {
  id: UUID!
  label: String!
  url: String!
}

enum Kind {
  RESCUE
  TRANSFER
  MEDEVAC
  INCIDENT
  SHIPWRECK
  DEAD_MISSING
}

type MapPoint {
  id: ID!
  longitude: Float!
  latitude: Float!
  kind: Kind!
}

type MapResult {
  points: [MapPoint!]!
  locatedCount: Int!
  truncated: Boolean!
}

type PortType {
  id: UUID!
  name: String!
  countryCode: String!
}

type Position {
  longitude: Float!
  latitude: Float!
  precision: String!
}

type Query {
  dataMode: String!
  events(filters: EventFilter = null, limit: Int! = 50, offset: Int! = 0): EventPage!
  event(id: UUID!): EventType
  mapPoints(filters: EventFilter = null): MapResult!
}

type SourceType {
  id: UUID!
  name: String!
  url: String!
  licenseNote: String!
  synthetic: Boolean!
}

scalar UUID

type VesselType {
  id: UUID!
  name: String!
  imo: String!
}

type VoyageType {
  id: UUID!
  title: String!
  startedOn: Date!
  endedOn: Date
  logbookUrl: String!
}