components:
  schemas:
    ActionEnum:
      enum:
      - create_identity
      - link
      type: string
      description: |-
        * `create_identity` - create_identity
        * `link` - link
    Candidate:
      type: object
      properties:
        id:
          type: string
          format: uuid
        external_id:
          type: string
        summary:
          $ref: '#/components/schemas/Summary'
      required:
      - external_id
      - id
      - summary
    DataModeEnum:
      enum:
      - production
      - training
      type: string
      description: |-
        * `production` - production
        * `training` - training
    Decision:
      type: object
      properties:
        identity:
          type: string
          format: uuid
        external_id:
          type: string
        match:
          type: string
        approved_by:
          type: string
        approved_at:
          type: string
          format: date-time
        reason:
          type: string
      required:
      - approved_at
      - approved_by
      - external_id
      - identity
      - match
      - reason
    DecisionRequestRequest:
      type: object
      properties:
        action:
          $ref: '#/components/schemas/ActionEnum'
        identity:
          type: string
          format: uuid
        reason:
          type: string
          minLength: 1
          maxLength: 2000
      required:
      - action
      - reason
    Error:
      type: object
      properties:
        code:
          type: string
        detail:
          type: string
        errors: {}
      required:
      - code
      - detail
    Event:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        title:
          type: string
          readOnly: true
        summary:
          type: string
          readOnly: true
        occurred_on:
          type: string
          format: date
          readOnly: true
        kind:
          allOf:
          - $ref: '#/components/schemas/KindEnum'
          readOnly: true
        people:
          type: integer
          readOnly: true
          nullable: true
        women:
          type: integer
          readOnly: true
          nullable: true
        minors:
          type: integer
          readOnly: true
          nullable: true
        source_url:
          type: string
          format: uri
          readOnly: true
        source:
          $ref: '#/components/schemas/Source'
        vessel:
          allOf:
          - $ref: '#/components/schemas/Vessel'
          nullable: true
        voyage:
          allOf:
          - $ref: '#/components/schemas/Voyage'
          nullable: true
        port:
          allOf:
          - $ref: '#/components/schemas/Port'
          nullable: true
        position:
          allOf:
          - $ref: '#/components/schemas/Position'
          nullable: true
          readOnly: true
      required:
      - id
      - kind
      - minors
      - occurred_on
      - people
      - port
      - position
      - source
      - source_url
      - summary
      - title
      - vessel
      - voyage
      - women
    EventPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Event'
        total_count:
          type: integer
        has_next:
          type: boolean
        data_mode:
          $ref: '#/components/schemas/DataModeEnum'
      required:
      - data_mode
      - has_next
      - items
      - total_count
    Evidence:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        label:
          type: string
          readOnly: true
        url:
          type: string
          format: uri
          readOnly: true
      required:
      - id
      - label
      - url
    EvidencePage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Evidence'
        total_count:
          type: integer
        has_next:
          type: boolean
      required:
      - has_next
      - items
      - total_count
    ExactCarriesRequestRequest:
      type: object
      properties:
        rows:
          type: array
          items:
            type: string
            format: uuid
          maxItems: 100
          minItems: 1
        reason:
          type: string
          minLength: 1
          maxLength: 2000
      required:
      - reason
      - rows
    ExactCarriesResult:
      type: object
      properties:
        carried:
          type: integer
      required:
      - carried
    IdentityPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Candidate'
      required:
      - items
    KindEnum:
      enum:
      - rescue
      - transfer
      - medevac
      - incident
      - shipwreck
      - dead_missing
      type: string
      description: |-
        * `rescue` - Sauvetage
        * `transfer` - Transfert
        * `medevac` - Évacuation médicale
        * `incident` - Incident
        * `shipwreck` - Naufrage
        * `dead_missing` - Décès / disparitions
    MapPoint:
      type: object
      properties:
        id:
          type: string
          format: uuid
        longitude:
          type: number
          format: double
        latitude:
          type: number
          format: double
        kind:
          $ref: '#/components/schemas/KindEnum'
      required:
      - id
      - kind
      - latitude
      - longitude
